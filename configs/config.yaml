project:
  name: "HydroMet-ETL"
  study_area: "Tanzania"
  description: "Reproducible hydrometeorological data engineering pipeline"

data:
  source: "NASA POWER"
  temporal_resolution: "daily"
  start_date: "2001-01-01"
  end_date: "2025-12-31"

nasa_power:
  base_url: "https://power.larc.nasa.gov/api/temporal/daily/point"
  community: "AG"
  format: "JSON"

  parameters:
    - T2M
    - T2M_MIN
    - T2M_MAX
    - RH2M
    - PRECTOTCORR
    - WS2M
    - ALLSKY_SFC_SW_DWN

locations:
  - name: "Arusha"
    latitude: -3.3869
    longitude: 36.6830

  - name: "Dodoma"
    latitude: -6.1630
    longitude: 35.7516

  - name: "Dar_es_Salaam"
    latitude: -6.7924
    longitude: 39.2083

  - name: "Morogoro"
    latitude: -6.8235
    longitude: 37.6680

  - name: "Mbeya"
    latitude: -8.9094
    longitude: 33.4608

  - name: "Mwanza"
    latitude: -2.5164
    longitude: 32.9175

  - name: "Songea"
    latitude: -10.6822
    longitude: 35.6513

  - name: "Tabora"
    latitude: -5.0162
    longitude: 32.8266


paths:
  raw: "data/raw"
  interim: "data/interim"
  processed: "data/processed"
  outputs: "outputs"